name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 请确保 package.json 中有 build:export 脚本： "build:export": "next build && next export -o out"
      - name: Build and export static site
        run: pnpm run build:export

      - name: Show build output candidates
        run: |
          echo "工作目录: $(pwd)"
          echo "列出根目录文件："
          ls -la
          echo "查看常见输出目录（若不存在会返回非0，但这里使用 || true 保持继续）："
          ls -la out || true
          ls -la dist || true
          ls -la .output || true
          ls -la build || true
          ls -la public || true

      - name: Detect output directory
        id: detect
        run: |
          # 优先检测常见的静态构建输出目录并确保非空
          for d in out dist .output/public .output build public; do
            if [ -d "$d" ] && [ "$(ls -A $d)" ]; then
              echo "Found output dir: $d"
              echo "output=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "未找到非空输出目录，列出根目录以调试："
          ls -la
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.output }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000 # 15 分钟超时