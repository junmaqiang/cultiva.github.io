name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and export static site
        run: pnpm run build:export

      - name: Show build output
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of root directory:"
          ls -la
          echo ""
          echo "Contents of out directory (if exists):"
          ls -la out || echo "out directory not found"

      - name: Detect output directory
        id: detect
        run: |
          for d in out dist .output/public .output build public; do
            if [ -d "$d" ] && [ -n "$(ls -A $d 2>/dev/null)" ]; then
              echo "Found output dir: $d"
              echo "output=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "ERROR: No non-empty output directory found"
          ls -la
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.output }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000